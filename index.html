<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>ÁGORA · Reserva tu momento</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f;background:#f5f5f7;font-synthesis:none;color-scheme:only light}*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f}button,input{font:inherit;color:#1d1d1f}button{cursor:pointer;min-height:46px;border:0}button:focus-visible,input:focus-visible{outline:3px solid #007aff;outline-offset:4px}button:disabled{cursor:default;opacity:.4}.shell{max-width:1100px;margin:auto;padding:0 32px}header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedee3}.brand{font-size:22px;letter-spacing:5px;font-weight:750}.sub{font-size:10px;letter-spacing:3px;color:#6e6e73;margin-top:5px}.pill{color:#1d1d1f;background:#fff;border:1px solid #dedee3;border-radius:30px;padding:0 20px;font-size:13px;font-weight:600}.demo{color:#6e6e73;font-size:12px;display:flex;gap:8px;align-items:center}.dot{width:6px;height:6px;background:#7b827e;border-radius:50%}main{padding:52px 0 35px;min-height:75vh}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:650;letter-spacing:2px;color:#6e6e73}h1{font-size:clamp(36px,6vw,58px);letter-spacing:-2.5px;line-height:1.06;margin:16px 0}h2{font-size:23px;letter-spacing:-.7px;margin:0 0 8px}p{color:#6e6e73;line-height:1.6}.intro{max-width:560px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px}.barber{background:#fff;border:1px solid #e7e7ec;border-radius:25px;padding:12px;text-align:left;transition:transform .2s,box-shadow .2s}.barber:hover{transform:translateY(-4px);box-shadow:0 16px 36px #00000009}.portrait{height:175px;border-radius:17px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(145deg,#e5e9ed,#c9d1da)}.portrait:before{content:'';width:100px;height:100px;border-radius:50%;background:#ffffff44;position:absolute;top:23px}.portrait:after{content:'';width:200px;height:130px;border-radius:100px 100px 0 0;background:#ffffff55;position:absolute;top:117px}.initials{font-size:46px;font-weight:300;color:#475564;z-index:1;letter-spacing:-3px}.binfo{padding:20px 10px 12px}.bname{font-size:19px;font-weight:650}.muted{font-size:13px;color:#6e6e73}.availability{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:12px}.arrow{border-radius:50%;background:#f2f2f7;width:32px;height:32px;display:grid;place-items:center;font-size:17px}.first{margin-top:18px;padding:18px 22px;width:100%;text-align:left;border:1px solid #dedee3;border-radius:18px;background:transparent;display:flex;justify-content:space-between;align-items:center}.first b{font-size:14px}.first small{display:block;color:#6e6e73;margin-top:5px}.back{background:transparent;color:#0071e3;padding:0 0 20px;min-height:44px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;margin-top:25px;align-items:start}.panel{background:white;border:1px solid #e7e7ec;border-radius:24px;padding:26px}.section{margin-bottom:28px}.label{font-size:14px;font-weight:650;margin-bottom:13px}.services{display:grid;gap:9px}.service{display:flex;align-items:center;justify-content:space-between;text-align:left;background:#f5f5f7;border:1.5px solid transparent;border-radius:14px;padding:15px}.service small{display:block;color:#6e6e73;margin-top:5px;font-size:12px}.selected{border-color:#0071e3!important;background:#f0f7ff!important}.check{color:#0071e3;margin-right:7px}.days{display:flex;gap:8px;overflow:auto;padding:3px 2px 9px}.day{flex:0 0 65px;border:1.5px solid transparent;border-radius:14px;background:#f5f5f7;padding:12px 8px}.day small{display:block;color:#6e6e73;font-size:11px}.day strong{display:block;font-size:22px;margin-top:7px}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.time{background:#f5f5f7;border:1.5px solid transparent;border-radius:11px;font-size:13px}.primary{background:#0071e3;color:white;border-radius:13px;width:100%;padding:15px;font-weight:600}.summary{position:sticky;top:24px}.summary dl{font-size:13px;margin:25px 0}.summary dt{color:#6e6e73;margin-top:18px}.summary dd{margin:6px 0 0;font-weight:550}.total{display:flex;justify-content:space-between;border-top:1px solid #e7e7ec;padding:20px 0;font-weight:650}.footnote{font-size:11px;text-align:center;line-height:1.6;color:#6e6e73}.profile{display:flex;align-items:center;gap:15px}.avatar{width:58px;height:58px;display:grid;place-items:center;background:#dde5ed;border-radius:19px;font-size:21px;color:#475564}input{border:1px solid #d2d2d7;background:#fafafa;border-radius:12px;padding:15px;width:100%;margin:8px 0 20px;min-height:48px}label{font-size:13px;font-weight:600}.success{max-width:520px;margin:0 auto;text-align:center}.success-icon{margin:0 auto 22px;width:70px;height:70px;background:#e2f4e9;color:#217846;border-radius:50%;display:grid;place-items:center;font-size:30px}.notice{background:#f1f5fa;border-radius:12px;padding:13px;font-size:12px;color:#526171;line-height:1.6;margin-bottom:22px}.row{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #eee;font-size:14px}.danger{background:#fff0f0;color:#b52121;border-radius:12px;padding:12px;width:100%;margin-top:10px}.empty{text-align:center;padding:30px 0}footer{border-top:1px solid #dedee3;padding:23px 0 28px;display:flex;justify-content:space-between;color:#6e6e73;font-size:11px}.view{animation:appear .25s ease}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:700px){.shell{padding:0 20px}header{height:78px}.brand{font-size:19px}.demo{display:none}main{padding-top:32px}.cards{grid-template-columns:1fr;gap:10px;margin-top:25px}.barber{display:flex;align-items:center;padding:10px;gap:10px}.portrait{width:86px;height:94px;flex-shrink:0;border-radius:13px}.portrait:before{width:55px;height:55px;top:7px}.portrait:after{width:95px;height:60px;top:64px}.initials{font-size:27px}.binfo{flex:1;padding:6px 5px}.availability{margin-top:14px}.layout{grid-template-columns:1fr;gap:16px}.panel{padding:20px;border-radius:20px}.summary{position:static}.summary dl{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:15px 0}.summary dt{margin-top:8px}.summary dd{text-align:right;margin-top:8px}h1{letter-spacing:-1.7px}.times{grid-template-columns:repeat(3,1fr)}footer{gap:15px;line-height:1.6}.first{padding:16px}.success{padding-top:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.single{max-width:580px;margin:0 auto}.single .panel{margin-top:25px}.single .summary{position:static}.customer{padding:0 0 18px;border-bottom:1px solid #e7e7ec;margin-bottom:22px}.customer dd{overflow-wrap:anywhere}.single h1{font-size:clamp(32px,5vw,48px)}input:-webkit-autofill{-webkit-text-fill-color:#1d1d1f;box-shadow:0 0 0 1000px #fafafa inset}</style></head><body><div class="shell"><header><div><div class="brand">ÁGORA</div><div class="sub">BARBERÍA · BOCETO</div></div><button class="pill" id="my">Mi cita</button></header><main id="app" tabindex="-1"></main><footer><span>ÁGORA — Identidad de ejemplo</span><span>Prototipo · Servicios, precios y horarios de muestra</span></footer></div><script>
const app=document.querySelector('#app');
const barbers=[{name:'Barbero 1',initials:'B1',color:'#cbd6df'},{name:'Barbero 2',initials:'B2',color:'#ddd4c9'},{name:'Barbero 3',initials:'B3',color:'#cbd8cf'}];
const services=[{name:'Corte de cabello',duration:40,price:30000},{name:'Diseño de barba',duration:25,price:20000},{name:'Corte + barba',duration:60,price:45000}];
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const dates=Array.from({length:10},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);return d});
const fullDate=i=>dates[i].toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
const draft={name:'',contact:''};
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={view:'home',barber:null,service:null,day:0,time:null},booking=null;
try{booking=JSON.parse(localStorage.getItem('agora-demo-booking'))}catch{}
function save(){try{localStorage.setItem('agora-demo-booking',JSON.stringify(booking))}catch{}}
function go(view){state.view=view;render();window.scrollTo({top:0,behavior:'instant'});app.focus({preventScroll:true})}
function summary(){const s=services[state.service];return `<h2>Tu reserva</h2><p class="muted">Todo claro, antes de confirmar.</p><dl><dt>Profesional</dt><dd>${barbers[state.barber].name}</dd><dt>Servicio</dt><dd>${s?s.name:'Por elegir'}</dd><dt>Fecha</dt><dd>${fullDate(state.day)}</dd><dt>Hora</dt><dd>${state.time||'Por elegir'}</dd>${s?`<dt>Duración</dt><dd>${s.duration} minutos</dd>`:''}</dl><div class="total"><span>Total de muestra</span><span>${s?money(s.price):'—'}</span></div>`}
function render(){app.innerHTML=`<div class="view">${content()}</div>`;bind()}
function content(){if(state.view==='home')return `<div class="intro"><div class="eyebrow">Tu tiempo. Tu estilo.</div><h1>Tu próximo corte,<br>sin complicaciones.</h1><p>Elige con quién reservar.<br>Nos encargamos de que el resto sea fácil.</p></div><div class="cards">${barbers.map((b,i)=>`<button class="barber" data-barber="${i}" aria-label="Reservar con ${b.name}"><div class="portrait" style="background:linear-gradient(145deg,#f0f1f3,${b.color})"><span class="initials">${b.initials}</span></div><div class="binfo"><div class="bname">${b.name}</div><div class="muted" style="margin-top:5px">Corte · Barba · Estilo</div><div class="availability"><span>Ver horarios de muestra</span><span class="arrow" aria-hidden="true">↗</span></div></div></button>`).join('')}</div><button class="first" data-barber="0"><span><b>Sin preferencia de barbero</b><small>Explora la agenda de ejemplo del Barbero 1.</small></span><span aria-hidden="true">→</span></button>`;
if(state.view==='reserve')return `<button class="back" id="backhome">‹ Volver a barberos</button><div class="profile"><div class="avatar">${barbers[state.barber].initials}</div><div><div class="eyebrow">Reserva tu momento</div><h2 style="margin:6px 0 0">${barbers[state.barber].name}</h2></div></div><div class="layout"><div class="panel"><div class="section"><div class="label">01 &nbsp; Elige tu servicio</div><div class="services">${services.map((s,i)=>`<button class="service ${state.service===i?'selected':''}" data-service="${i}" aria-pressed="${state.service===i}"><span><b>${state.service===i?'<span class="check">✓</span>':''}${s.name}</b><small>${s.duration} min · Servicio de muestra</small></span><strong>${money(s.price)}</strong></button>`).join('')}</div></div><div class="section"><div class="label">02 &nbsp; Encuentra tu día</div><div class="days">${dates.map((d,i)=>`<button class="day ${state.day===i?'selected':''}" data-day="${i}" aria-label="${fullDate(i)}" aria-pressed="${state.day===i}"><small>${d.toLocaleDateString('es-CO',{weekday:'short'})}</small><strong>${d.getDate()}</strong><small>${d.toLocaleDateString('es-CO',{month:'short'})}</small></button>`).join('')}</div></div><div><div class="label">03 &nbsp; Elige una hora</div>${state.service===null?'<p class="muted">Selecciona un servicio para ver horarios de ejemplo.</p>':`<div class="times">${['09:00','10:15','11:30','14:00','15:15','16:30'].map(t=>`<button class="time ${state.time===t?'selected':''}" data-time="${t}" aria-pressed="${state.time===t}">${t}</button>`).join('')}</div><p class="muted" style="font-size:11px">Disponibilidad simulada; no corresponde a una agenda real.</p>`}</div></div><aside class="panel summary">${summary()}<button class="primary" id="continue" ${state.service===null||!state.time?'disabled':''}>Continuar →</button><div class="footnote" style="margin-top:12px">Aún no has reservado ningún turno.</div></aside></div>`;
if(state.view==='details')return `<div class="single"><button class="back" id="backreserve">‹ Volver al horario</button><div class="eyebrow">Tus datos · Paso 1 de 2</div><h1>¿A nombre de quién?</h1><p>Completa tus datos. Al salir del último campo válido, verás el resumen para confirmar.</p><form class="panel" id="form"><div class="notice">Demostración: usa datos ficticios. No se envía información a la barbería.</div><label for="name">Nombre</label><input id="name" name="name" placeholder="Tu nombre" value="${escapeHtml(draft.name)}" required maxlength="70" autocomplete="name" aria-describedby="autohelp"><label for="contact">Correo electrónico</label><input id="contact" name="contact" type="email" placeholder="nombre@ejemplo.com" value="${escapeHtml(draft.contact)}" required maxlength="120" autocomplete="email" aria-describedby="autohelp"><p class="muted" id="autohelp" tabindex="0">Al terminar, toca fuera del campo o pulsa Tab o Enter para revisar tu reserva. Tu cita todavía no está confirmada.</p></form></div>`;
if(state.view==='review')return `<div class="single"><button class="back" id="editdetails">‹ Corregir mis datos</button><div class="eyebrow">Revisión · Paso 2 de 2</div><h1>Revisa tu cita.</h1><p>Comprueba que todo esté bien antes de confirmar.</p><section class="panel summary"><dl class="customer"><dt>Nombre</dt><dd>${escapeHtml(draft.name)}</dd><dt>Correo electrónico</dt><dd>${escapeHtml(draft.contact)}</dd></dl>${summary()}<button class="primary" id="confirmbooking">Confirmar cita de prueba</button><p class="footnote">Solo se guardará una cita de prueba en este navegador.</p></section></div>`;
if(state.view==='success'||state.view==='manage'){if(!booking)return `<button class="back" id="backhome">‹ Volver al inicio</button><div class="empty"><h1>Tu próxima visita<br>empieza aquí.</h1><p>No tienes citas de prueba guardadas en este navegador.</p><button class="primary" id="new" style="max-width:280px">Elegir barbero</button></div>`;return `<div class="success"><div class="success-icon">${booking.cancelled?'−':'✓'}</div><div class="eyebrow">${booking.cancelled?'Cita cancelada':'Reserva de demostración'}</div><h1>${booking.cancelled?'Nos vemos pronto.':state.view==='success'?'Todo listo.':'Tu próxima cita.'}</h1><p>${booking.cancelled?'Tu cita de prueba ha sido cancelada.':'Esta es una simulación: no ocupa un turno real.'}</p><div class="panel" style="text-align:left;margin:25px 0"><div class="row"><span>Profesional</span><b>${barbers[booking.barber].name}</b></div><div class="row"><span>Servicio</span><b>${services[booking.service].name}</b></div><div class="row"><span>Fecha</span><b>${booking.date}</b></div><div class="row"><span>Hora</span><b>${booking.time}</b></div><div class="row"><span>Total de muestra</span><b>${money(services[booking.service].price)}</b></div></div>${!booking.cancelled?'<button class="primary" id="reschedule">Cambiar horario</button><button class="danger" id="cancel">Cancelar cita de prueba</button>':'<button class="primary" id="new">Reservar otra cita</button>'}<button class="back" id="backhome" style="margin-top:20px">Volver al inicio</button></div>`}return ''}
function bind(){document.querySelectorAll('[data-barber]').forEach(b=>b.onclick=()=>{state.barber=Number(b.dataset.barber);state.time=null;go('reserve')});document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{state.service=Number(b.dataset.service);state.time=null;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=Number(b.dataset.day);state.time=null;render()});document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{state.time=b.dataset.time;render()});const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};on('backhome',()=>go('home'));on('backreserve',()=>go('reserve'));on('continue',()=>go('details'));on('new',()=>{state.service=null;state.time=null;go('home')});on('reschedule',()=>{state.barber=booking.barber;state.service=booking.service;state.time=null;go('reserve')});on('cancel',()=>{if(confirm('¿Quieres cancelar esta cita de prueba?')){booking.cancelled=true;save();go('manage')}});on('editdetails',()=>go('details'));on('confirmbooking',()=>{if(state.view!=='review'||state.service===null||!state.time)return;booking={barber:state.barber,service:state.service,date:fullDate(state.day),time:state.time,cancelled:false};save();go('success')});
const form=document.getElementById('form');if(form){const name=form.elements.name,contact=form.elements.contact;const sync=()=>{draft.name=name.value;draft.contact=contact.value;name.setCustomValidity(name.value.trim()?'':'Escribe tu nombre.');};const review=()=>{sync();if(state.view!=='details'||!form.checkValidity())return;draft.name=draft.name.trim();draft.contact=draft.contact.trim();go('review')};form.addEventListener('input',sync);form.addEventListener('focusout',event=>{if(event.target!==name&&event.target!==contact)return;setTimeout(()=>{if(state.view!=='details'||!form.isConnected)return;const active=document.activeElement;if(active===name||active===contact||active?.closest('button'))return;review()},0)});form.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing){event.preventDefault();sync();if(form.reportValidity())review()}});form.onsubmit=event=>{event.preventDefault();sync();if(form.reportValidity())review()}}}

document.getElementById('my').onclick=()=>go('manage');render();
</script></body></html>
