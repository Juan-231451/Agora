const app=document.querySelector('#app');
const barbers=[{name:'Barbero 1',initials:'B1',color:'#cbd6df'},{name:'Barbero 2',initials:'B2',color:'#ddd4c9'},{name:'Barbero 3',initials:'B3',color:'#cbd8cf'}];
const services=[{name:'Corte de cabello',duration:40,price:30000},{name:'Diseño de barba',duration:25,price:20000},{name:'Corte + barba',duration:60,price:45000}];
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const dates=Array.from({length:10},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);return d});
const fullDate=i=>dates[i].toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
const draft={name:'',contact:'',whatsapp:false};
const normalizePhone=value=>{let n=String(value).replace(/[\s()+.-]/g,'');if(n.startsWith('57')&&n.length===12)n=n.slice(2);return /^3[0-9]{9}$/.test(n)?'+57'+n:null};
const isoDay=i=>{const d=dates[i];return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={view:'home',barber:null,service:null,day:0,time:null},booking=null;
try{const saved=JSON.parse(localStorage.getItem('agora-demo-booking'));if(saved&&Number.isInteger(saved.barber)&&barbers[saved.barber]&&Number.isInteger(saved.service)&&services[saved.service]&&typeof saved.date==='string'&&typeof saved.time==='string')booking=saved}catch{}
let persisted=true;
function updateHeader(){document.body.classList.toggle('compact',window.scrollY>12||state.view!=='home');document.body.classList.toggle('inner',state.view!=='home')}
window.addEventListener('scroll',updateHeader,{passive:true});
function save(){try{localStorage.setItem('agora-demo-booking',JSON.stringify(booking));persisted=true}catch{persisted=false}}
function go(view){state.view=view;render();window.scrollTo({top:0,behavior:'instant'});app.focus({preventScroll:true});updateHeader()}
function summary(){const s=services[state.service];return `<h2>Tu reserva</h2><p class="muted">Todo claro, antes de confirmar.</p><dl><dt>Profesional</dt><dd>${barbers[state.barber].name}</dd><dt>Servicio</dt><dd>${s?s.name:'Por elegir'}</dd><dt>Fecha</dt><dd>${fullDate(state.day)}</dd><dt>Hora</dt><dd>${state.time||'Por elegir'}</dd>${s?`<dt>Duración</dt><dd>${s.duration} minutos</dd>`:''}</dl><div class="total"><span>Total de muestra</span><span>${s?money(s.price):'—'}</span></div>`}
function render(){app.innerHTML=`<div class="view">${content()}</div>`;bind();updateHeader()}
function content(){if(state.view==='home')return `<div class="intro"><div class="eyebrow">Tu tiempo. Tu estilo.</div><h1>Tu próximo corte,<br>sin complicaciones.</h1><p>Elige con quién reservar.<br>Nos encargamos de que el resto sea fácil.</p></div><div class="cards">${barbers.map((b,i)=>`<button class="barber" data-barber="${i}" aria-label="Reservar con ${b.name}"><div class="portrait" style="background:linear-gradient(145deg,#f0f1f3,${b.color})"><span class="initials">${b.initials}</span></div><div class="binfo"><div class="bname">${b.name}</div><div class="muted" style="margin-top:5px">Corte · Barba · Estilo</div><div class="availability"><span>Ver horarios de muestra</span><span class="arrow" aria-hidden="true">↗</span></div></div></button>`).join('')}</div><button class="first" data-barber="0"><span><b>Sin preferencia de barbero</b><small>Explora la agenda de ejemplo del Barbero 1.</small></span><span aria-hidden="true">→</span></button>`;
if(state.view==='reserve')return `<button class="back" id="backhome">‹ Volver a barberos</button><div class="profile"><div class="avatar">${barbers[state.barber].initials}</div><div><div class="eyebrow">Reserva tu momento</div><h2 style="margin:6px 0 0">${barbers[state.barber].name}</h2></div></div><div class="layout"><div class="panel"><div class="section"><div class="label">01 &nbsp; Elige tu servicio</div><div class="services">${services.map((s,i)=>`<button class="service ${state.service===i?'selected':''}" data-service="${i}" aria-pressed="${state.service===i}"><span><b>${state.service===i?'<span class="check">✓</span>':''}${s.name}</b><small>${s.duration} min · Servicio de muestra</small></span><strong>${money(s.price)}</strong></button>`).join('')}</div></div><div class="section"><div class="label">02 &nbsp; Encuentra tu día</div><div class="days">${dates.map((d,i)=>`<button class="day ${state.day===i?'selected':''}" data-day="${i}" aria-label="${fullDate(i)}" aria-pressed="${state.day===i}"><small>${d.toLocaleDateString('es-CO',{weekday:'short'})}</small><strong>${d.getDate()}</strong><small>${d.toLocaleDateString('es-CO',{month:'short'})}</small></button>`).join('')}</div></div><div><div class="label">03 &nbsp; Elige una hora</div>${state.service===null?'<p class="muted">Selecciona un servicio para ver horarios de ejemplo.</p>':`<div class="times">${['09:00','10:15','11:30','14:00','15:15','16:30'].map(t=>`<button class="time ${state.time===t?'selected':''}" data-time="${t}" aria-pressed="${state.time===t}">${t}</button>`).join('')}</div><p class="muted" style="font-size:11px">Disponibilidad simulada; no corresponde a una agenda real.</p>`}</div></div><aside class="panel summary">${summary()}<button class="primary" id="continue" ${state.service===null||!state.time?'disabled':''}>Continuar →</button><div class="footnote" style="margin-top:12px">Aún no has reservado ningún turno.</div></aside></div>`;
if(state.view==='details')return `<div class="single"><button class="back" id="backreserve">‹ Volver al horario</button><div class="eyebrow">Tus datos · Paso 1 de 2</div><h1>¿A nombre de quién?</h1><p>Completa tus datos. Al salir del último campo válido, verás el resumen para confirmar.</p><form class="panel" id="form"><div class="notice">Demostración: usa datos ficticios. No se envía información a la barbería.</div><label for="name">Nombre</label><input id="name" name="name" placeholder="Tu nombre" value="${escapeHtml(draft.name)}" required maxlength="70" autocomplete="name" aria-describedby="autohelp"><label for="contact">Número de celular</label><div class="phonebox"><span aria-label="Indicativo de Colombia">CO +57</span><input id="contact" name="contact" type="tel" inputmode="tel" placeholder="3XX XXX XXXX" value="${escapeHtml(draft.contact)}" required maxlength="20" autocomplete="tel-national" aria-describedby="phonehelp phoneerror autohelp"></div><p id="phoneerror" class="error" aria-live="polite"></p><p class="field-help" id="phonehelp">Celular colombiano: 10 dígitos que comienzan por 3. Puedes pegar el número con +57.</p><p class="muted" id="autohelp" tabindex="0">Al terminar, toca fuera del campo o pulsa Tab o Enter para revisar tu reserva. Tu cita todavía no está confirmada.</p></form></div>`;
if(state.view==='review')return `<div class="single"><button class="back" id="editdetails">‹ Corregir mis datos</button><div class="eyebrow">Revisión · Paso 2 de 2</div><h1>Revisa tu cita.</h1><p>Comprueba que todo esté bien antes de confirmar.</p><section class="panel summary"><dl class="customer"><dt>Nombre</dt><dd>${escapeHtml(draft.name)}</dd><dt>Celular</dt><dd>${escapeHtml(normalizePhone(draft.contact)||draft.contact)}</dd></dl>${summary()}<label class="consent"><input id="whatsapp" type="checkbox" ${draft.whatsapp?'checked':''}><span>Quiero recibir la confirmación y los recordatorios de Ágora por WhatsApp.<br><small class="muted">Opcional. En este boceto no se envían mensajes.</small></span></label><button class="primary" id="confirmbooking">Confirmar cita de prueba</button><p class="footnote">Solo se guardará una cita de prueba en este navegador.</p></section></div>`;
if(state.view==='recover')return `<div class="single recover"><button class="back" id="backmanage">‹ Volver a mi cita</button><div class="eyebrow">Sin cuentas ni contraseñas</div><h1>Tu cita, a mano.</h1><div class="panel"><h2>Desde WhatsApp</h2><p>En la versión conectada, recibirás un enlace privado para consultar o cambiar tu cita, aunque cierres la pestaña.</p><h2>Desde «Mi cita»</h2><ol><li>Introduces el celular usado al reservar.</li><li>Recibes un código temporal por WhatsApp.</li><li>Lo verificas aquí y accedes a tus citas.</li></ol><div class="notice">Integración pendiente. El boceto solo recupera la última cita guardada en este navegador; no envía códigos ni busca reservas por teléfono.</div></div></div>`;
if(state.view==='success'||state.view==='manage'){if(!booking)return `<button class="back" id="backhome">‹ Volver al inicio</button><div class="empty"><h1>Tu próxima visita<br>empieza aquí.</h1><p>No tienes citas de prueba guardadas en este navegador.</p><button class="primary" id="new" style="max-width:280px">Elegir barbero</button><button class="check-link" id="recover">¿Reservaste desde otro dispositivo?</button></div>`;return `<div class="success"><div class="success-icon">${booking.cancelled?'−':'✓'}</div><div class="eyebrow">${booking.cancelled?'Cita cancelada':'Reserva de demostración'}</div><h1>${booking.cancelled?'Nos vemos pronto.':state.view==='success'?'Todo listo.':'Tu próxima cita.'}</h1><p>${booking.cancelled?'Tu cita de prueba ha sido cancelada.':'Esta es una simulación: no ocupa un turno real.'}</p><div class="panel" style="text-align:left;margin:25px 0">${booking.name?`<div class="row"><span>Nombre</span><b>${escapeHtml(booking.name)}</b></div>`:''}${booking.phone?`<div class="row"><span>Celular</span><b>${escapeHtml(booking.phone)}</b></div>`:''}<div class="row"><span>Profesional</span><b>${barbers[booking.barber].name}</b></div><div class="row"><span>Servicio</span><b>${services[booking.service].name}</b></div><div class="row"><span>Fecha</span><b>${escapeHtml(booking.date)}</b></div><div class="row"><span>Hora</span><b>${escapeHtml(booking.time)}</b></div><div class="row"><span>Total de muestra</span><b>${money(services[booking.service].price)}</b></div></div>${!booking.cancelled?`<button class="primary" id="reschedule">Cambiar horario</button>${booking.dateISO?'<button class="secondary" id="calendar">＋ Añadir a mi calendario</button><p class="calendar-note">Descarga una cita de prueba con aviso 30 minutos antes. Ábrela en tu calendario para guardarla. Si cambias o cancelas la reserva, actualiza también tu calendario.</p>':''}<button class="danger" id="cancel">Cancelar cita de prueba</button>`:'<button class="primary" id="new">Reservar otra cita</button>'}<p class="status-note">${persisted?'Tu cita de prueba se recuerda en este navegador aunque cierres la pestaña.':'<span class="storage-warning">No se pudo guardar en este navegador. Conserva los datos antes de cerrar.</span>'}</p>${booking.whatsappOptIn?'<div class="notice">WhatsApp solicitado. El envío estará disponible al conectar la agenda; todavía no se ha enviado ningún mensaje.</div>':''}<button class="check-link" id="recover">Cómo recuperar mi cita desde otro dispositivo</button><button class="back" id="backhome" style="margin-top:20px">Volver al inicio</button></div>`}return ''}
function bind(){document.querySelectorAll('[data-barber]').forEach(b=>b.onclick=()=>{state.editing=false;state.barber=Number(b.dataset.barber);state.time=null;go('reserve')});document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{state.service=Number(b.dataset.service);state.time=null;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=Number(b.dataset.day);state.time=null;render()});document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{state.time=b.dataset.time;render()});const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};on('backhome',()=>go('home'));on('backreserve',()=>go('reserve'));on('continue',()=>go('details'));on('new',()=>{state.service=null;state.time=null;go('home')});on('reschedule',()=>{state.editing=true;draft.name=booking.name||'';draft.contact=booking.phone||'';draft.whatsapp=!!booking.whatsappOptIn;state.barber=booking.barber;state.service=booking.service;state.time=null;go('reserve')});on('cancel',()=>{if(confirm('¿Quieres cancelar esta cita de prueba?')){booking.cancelled=true;save();go('manage')}});on('editdetails',()=>go('details'));on('recover',()=>go('recover'));on('backmanage',()=>go('manage'));on('calendar',downloadCalendar);const opt=document.getElementById('whatsapp');if(opt)opt.onchange=()=>{draft.whatsapp=opt.checked};on('confirmbooking',()=>{if(state.view!=='review'||state.service===null||!state.time||!draft.name.trim()||!normalizePhone(draft.contact))return;booking={id:booking?.id&&state.editing?booking.id:(globalThis.crypto?.randomUUID?.()||String(Date.now())),sequence:state.editing?(booking?.sequence||0)+1:0,barber:state.barber,service:state.service,date:fullDate(state.day),dateISO:isoDay(state.day),time:state.time,name:draft.name,phone:normalizePhone(draft.contact),whatsappOptIn:draft.whatsapp,cancelled:false};save();go('success')});
const form=document.getElementById('form');if(form){const name=form.elements.name,contact=form.elements.contact;const sync=()=>{draft.name=name.value;draft.contact=contact.value;name.setCustomValidity(name.value.trim()?'':'Escribe tu nombre.');contact.setCustomValidity(normalizePhone(contact.value)?'':'Escribe un celular colombiano válido de 10 dígitos.');contact.setAttribute('aria-invalid',String(!!contact.value&&!normalizePhone(contact.value)));const error=document.getElementById('phoneerror');if(error)error.textContent=contact.value&&!normalizePhone(contact.value)?'Revisa el número: debe tener 10 dígitos y empezar por 3.':'';};const review=()=>{sync();if(state.view!=='details'||!form.checkValidity())return;draft.name=draft.name.trim();draft.contact=draft.contact.trim();go('review')};form.addEventListener('input',sync);form.addEventListener('focusout',event=>{if(event.target!==name&&event.target!==contact)return;setTimeout(()=>{if(state.view!=='details'||!form.isConnected)return;const active=document.activeElement;if(active===name||active===contact||active?.closest('button'))return;review()},0)});form.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing){event.preventDefault();sync();if(form.reportValidity())review()}});form.onsubmit=event=>{event.preventDefault();sync();if(form.reportValidity())review()}}}


function calendarText(b){
 if(!b||b.cancelled||!/^\d{4}-\d{2}-\d{2}$/.test(b.dateISO||'')||!/^\d{2}:\d{2}$/.test(b.time))return null;
 const start=new Date(b.dateISO+'T'+b.time+':00-05:00');
 if(!Number.isFinite(start.getTime()))return null;
 const end=new Date(start.getTime()+services[b.service].duration*60000);
 const stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const clean=x=>String(x).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
 return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AGORA//Booking Demo//ES','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+clean(b.id||'demo')+'@agora-demo','SEQUENCE:'+(b.sequence||0),'DTSTAMP:'+stamp(new Date()),'DTSTART:'+stamp(start),'DTEND:'+stamp(end),'SUMMARY:'+clean('Cita de prueba - Ágora'),'DESCRIPTION:'+clean(services[b.service].name+' con '+barbers[b.barber].name+'. Demostración: no es una reserva real.'),'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:Tu cita de prueba es en 30 minutos','END:VALARM','END:VEVENT','END:VCALENDAR',''].map(line=>{let out='',bytes=0;for(const char of line){const size=new TextEncoder().encode(char).length;if(bytes+size>75){out+='\r\n ';bytes=1}out+=char;bytes+=size}return out}).join('\r\n');
}
function downloadCalendar(){
 const text=calendarText(booking);if(!text)return;
 const url=URL.createObjectURL(new Blob([text],{type:'text/calendar;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='agora-cita.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

document.getElementById('my').onclick=()=>go('manage');render();
</script></body></html>
